name: Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Changes merged by anyone other than the repo owner wait for the owner's
  # approval on the production environment before going live.
  review:
    if: github.actor != github.repository_owner
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Approved
        run: echo "Approved for production"

  # A run approved late may be behind main. Skip it if a newer commit has
  # landed; that commit's own run deploys and releases instead.
  head-check:
    needs: review
    if: ${{ !cancelled() && (needs.review.result == 'success' || needs.review.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - name: Compare with main
        id: head
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main is at ${head:0:7}, past ${GITHUB_SHA:0:7}; skipping deploy and release"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: head-check
    if: ${{ !cancelled() && needs.head-check.outputs.current == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Detects pnpm from the lockfile and the packageManager pin; Node defaults to 24.
      - name: Check, build, and upload
        uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247 # v6.1.3
        with:
          build-cmd: pnpm check && pnpm build

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One deploy at a time; let an in-progress deploy finish rather than cancelling it.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Releases tag what is live, so they run only after a successful deploy.
  release:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # Releases run in order; never cancel one mid-tag.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      # Full history so semantic-release can find the last tag.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
