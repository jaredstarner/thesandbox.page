name: Experiment idea
description: Propose a new feature, experiment, or addition to the sandbox
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What would you add, and what is it meant to test or show?
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Approach
      description: Libraries, browser APIs, or techniques involved, if known.
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How we'll know the experiment works.
