name: Bug report
description: Something on the site or in the tooling is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://thesandbox.page/...
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Firefox 140, macOS 26
