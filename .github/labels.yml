# Repository labels, synced by .github/workflows/labels.yml.
# Labels not listed here are left alone.

# Sandbox runs
- name: sandbox
  color: e3b341
  description: Approved for a /sandbox run; applied by the owner or collaborators, never by issue forms
- name: experiment
  color: 7ff0e0
  description: A new experiment on its own page
- name: extend
  color: 5fb3a1
  description: Builds on an existing experiment or page
- name: rework
  color: a371f7
  description: Redoes something with a new technique or platform feature
- name: teardown
  color: b60205
  description: Replaces the home page or shared site chrome
- name: sandbox-failed
  color: d93f0b
  description: A /sandbox run that could not get its checks to pass

# General
- name: accessibility
  color: f143ab
  description: Barrier affecting people with disabilities
- name: bug
  color: d73a4a
  description: Something isn't working
- name: documentation
  color: 0075ca
  description: Improvements or additions to documentation
- name: duplicate
  color: cfd3d7
  description: This issue or pull request already exists
- name: enhancement
  color: a2eeef
  description: New feature or request
- name: good first issue
  color: 7057ff
  description: Good for newcomers
- name: help wanted
  color: "008672"
  description: Extra attention is needed
- name: invalid
  color: e4e669
  description: This doesn't seem right
- name: question
  color: d876e3
  description: Further information is requested
- name: released
  color: ededed
  description: Shipped in a release; applied by semantic-release
- name: wontfix
  color: ffffff
  description: This will not be worked on
